# =====================================================================
#  AS-HTS experiment configuration
#  Every key here overrides the built-in default in SimConfig.java.
#  Any key can also be overridden on the command line: --key value
# =====================================================================

# ---------------- Datacenter ----------------
dc.hosts=4
dc.host.pes=4
dc.host.pe.mips=3000
dc.host.ram=65536
# Heterogeneous single-PE VMs (MIPS). Total = 10,750 MIPS.
dc.vm.mips=500,750,1000,1000,1500,1500,2000,2500

# ---------------- Workload ----------------
wl.tasks=1000
# SLA deadline = arrival + slack * (length / mean VM MIPS)
sla.slack.HIGH=4
sla.slack.MEDIUM=8
sla.slack.LOW=16

# ---------------- Baseline: priority escalation (Silver-T formula) ----------------
# P = level * (base + w * waitSeconds)
prio.base=100
prio.w=1.0

# ---------------- Baseline: Genetic Algorithm ----------------
ga.population=30
ga.generations=40
ga.mutation=0.1
ga.crossover=0.9
ga.batch=16

# ---------------- AS-HTS ----------------
ashts.window=30
ashts.hysteresis=8
ashts.short.meanMI=30000
ashts.short.cv=1.0
ashts.mixed.hiFrac=0.25
ashts.mixed.loFrac=0.25
ashts.alpha0=0.1
ashts.beta=1.0
ashts.alphaMaxFactor=10.0
ashts.agingCap=10.0
ashts.adaptiveAlpha=true
ashts.switching=true

# ---------------- Experiment grid ----------------
exp.scenarios=SHORT_BURSTY,LONG_BATCH,MIXED_PRIORITY,PHASED,GOCJ
exp.loads=0.7,0.9,1.05
exp.policies=FCFS,SJF,RR,GA,PRIORITY_ESC,ASHTS,ASHTS_FIXED_ALPHA,ASHTS_NO_SWITCH
exp.seeds=1,2,3,4,5
exp.out=results
